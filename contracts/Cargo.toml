[workspace]
resolver = "2"
members = ["interface", "policy-gate", "grant-fund", "prediction-markets"]

[workspace.dependencies]
near-sdk = { version = "=5.9.0", features = ["legacy"] }
schemars = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
